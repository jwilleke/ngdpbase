name: Publish media-date package

# @jwilleke/media-date: the filename date parser ngdpbase and mjs-media-handling
# share, published to npm at core's version on each core release tag, with signed
# provenance. No npm token is stored: npm trusts this workflow (trusted
# publishing), set up once on npmjs.com for publish-media-date.yml.
#
# A pull request that touches the package builds, tests and packs it, and never
# publishes.

on:
  push:
    tags: ['v[0-9]*']
  pull_request:
    paths:
      - 'packages/media-date/**'
      - 'scripts/build-media-date-package.ts'
      - '.github/workflows/publish-media-date.yml'

permissions:
  contents: read

concurrency:
  group: publish-media-date-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install
        run: sh scripts/npm-ci-retry.sh

      - name: Build the package
        run: npm run build:media-date-package

      - name: Test
        run: NODE_ENV=test npx vitest run packages/media-date

      - name: Pack
        working-directory: packages/media-date/dist
        run: npm pack --dry-run --ignore-scripts

      - name: Publish with provenance
        if: github.event_name == 'push'
        working-directory: packages/media-date/dist
        run: |
          version=$(node -p 'require("./package.json").version')
          case "$version" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac
