name: Docker Build and Push

on:
  push:
    tags:
      - 'v*'
  # #956: validate Dockerfile changes BEFORE they reach a release tag. Until
  # now the image built only on `v*` or manual dispatch, so a broken Dockerfile
  # was discovered during a release build — the worst possible moment. Scoped to
  # the paths that can actually break the image, so ordinary PRs pay nothing.
  #
  # A PR run builds, smoke-tests and scans locally. It never pushes, never moves
  # `latest`, and never uploads SARIF (that would overwrite master's
  # code-scanning alerts with a PR's results — the inverse of #878).
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push to registry'
        required: false
        type: boolean
        default: false

env:
  DOCKER_IMAGE_NAME: ngdpbase
  DOCKER_NODE_VERSION: '24'
  DOCKER_REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.repository_owner }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.REGISTRY_USER }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # latest must move on release tags too, not just default-branch dispatches:
            # the Trivy step below scans :latest, and a tag run that leaves latest
            # stale scans the PREVIOUS image (#878). Guarded so a manual dispatch on
            # an old tag can't clobber latest.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=ngdpbase
            org.opencontainers.image.description=JSPWiki-inspired file-based wiki platform
            org.opencontainers.image.vendor=ngdpbase Project

      # PR runs have nothing in a registry to refer to, so the image is tagged
      # and scanned locally instead of by its published `:latest` name.
      - name: Resolve image reference
        id: img
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ env.DOCKER_IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ env.DOCKER_REGISTRY }}/${{ env.REGISTRY_USER }}/${{ env.DOCKER_IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          # MUST be explicit. The Dockerfile's last stage is `devtools`, which
          # retains npm — an untargeted build would silently publish that as the
          # deployed image and undo #956 (#1001).
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ github.event_name == 'pull_request' && steps.img.outputs.ref || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ env.DOCKER_NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # #1142: this used to start the container with NO password and assert it
      # came up, on the reasoning that a fresh headless install must boot
      # unattended on the shipped defaults (#1033, #1035).
      #
      # #1087 deliberately reversed that. A headless install resolving the
      # well-known `admin123` from this repository now REFUSES to start, because
      # it previously failed open onto a published credential while the docs
      # claimed it failed closed. The old assertion therefore tested for exactly
      # the behaviour that was removed on purpose, and failed because the
      # removal worked — silently, since this workflow only runs on tags, so
      # v4.12.0 was the first tag to reveal it and published a half release:
      # `4.12.0` and `latest` pushed, `4.12.0-devtools` never built.
      #
      # Both halves are asserted now, which is stronger than either alone.
      - name: Smoke test — an unconfigured headless install must REFUSE to boot
        run: |
          docker rm -f ngdpbase-smoke-refuse 2>/dev/null || true
          docker run -d --name ngdpbase-smoke-refuse \
            -e HEADLESS_INSTALL=true \
            -e NODE_ENV=production \
            ${{ steps.img.outputs.ref }}

          # It should exit almost immediately. Give it room, then require that
          # it is gone AND that it said why.
          for i in $(seq 1 12); do
            RUNNING=$(docker inspect --format='{{.State.Running}}' ngdpbase-smoke-refuse 2>/dev/null || echo "false")
            [ "$RUNNING" = "false" ] && break
            echo "  attempt $i/12: still running"
            sleep 5
          done

          if [ "$(docker inspect --format='{{.State.Running}}' ngdpbase-smoke-refuse 2>/dev/null)" = "true" ]; then
            echo "FAILED: a headless install with no admin password came up. #1087's guard is not"
            echo "        working in this image — it would create admin/admin123, a credential"
            echo "        published in this repository."
            docker logs ngdpbase-smoke-refuse
            docker rm -f ngdpbase-smoke-refuse 2>/dev/null || true
            exit 1
          fi

          if ! docker logs ngdpbase-smoke-refuse 2>&1 | grep -q "Refusing to create the bootstrap admin account"; then
            echo "FAILED: the container stopped, but not for #1087's reason. Something else is"
            echo "        wrong with first boot; the refusal message is absent."
            docker logs ngdpbase-smoke-refuse
            docker rm -f ngdpbase-smoke-refuse 2>/dev/null || true
            exit 1
          fi

          echo "Refused to bootstrap on the shipped password, as #1087 requires."
          docker rm -f ngdpbase-smoke-refuse 2>/dev/null || true

      - name: Smoke test — start container
        run: |
          # A configured headless install — the way a real unattended deploy is
          # set up — must come up. This is the original first-boot check from
          # #1033 / #1035, kept intact.
          #
          # The config file is required: #1087's guard compares the RESOLVED
          # password rather than reading the variable, so exporting
          # NGDPBASE_ADMIN_PASSWORD alone still resolves to the shipped default
          # and is still refused.
          mkdir -p "$RUNNER_TEMP/smoke-data/config"
          cat > "$RUNNER_TEMP/smoke-data/config/app-custom-config.json" <<'JSON'
          {
            "ngdpbase.user.security.defaultpassword": "$NGDPBASE_ADMIN_PASSWORD"
          }
          JSON

          SMOKE_PW="ci-smoke-$(openssl rand -hex 12)"

          docker run -d \
            --name ngdpbase-smoke \
            -p 3000:3000 \
            -e HEADLESS_INSTALL=true \
            -e NODE_ENV=production \
            -e NGDPBASE_ADMIN_PASSWORD="$SMOKE_PW" \
            -v "$RUNNER_TEMP/smoke-data:/app/data" \
            ${{ steps.img.outputs.ref }}

      - name: Smoke test — wait for healthy
        run: |
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 18); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' ngdpbase-smoke 2>/dev/null || echo "starting")
            echo "  attempt $i/18: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy."
              break
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              echo "Container reported unhealthy."
              docker logs ngdpbase-smoke
              exit 1
            fi
            if [ "$i" = "18" ]; then
              echo "Timed out waiting for healthy status."
              docker logs ngdpbase-smoke
              exit 1
            fi
            sleep 5
          done

      - name: Smoke test — the session secret was generated into the data volume
        run: |
          # #1194: NGDPBASE_SESSION_SECRET was deliberately NOT passed above.
          # The instance must have generated one and backfilled the per-instance
          # .env on the mounted volume, so the second boot signs cookies with
          # the same value — and never with the literal in app-default-config.
          if ! grep -q '^NGDPBASE_SESSION_SECRET=.\+' "$RUNNER_TEMP/smoke-data/.env" 2>/dev/null; then
            echo "FAILED: healthy, but no NGDPBASE_SESSION_SECRET line was written to the"
            echo "        data volume's .env. #1194's backfill is not working in this image."
            ls -la "$RUNNER_TEMP/smoke-data" || true
            docker logs ngdpbase-smoke
            exit 1
          fi
          if grep -q 'ngdpbase-session-secret-change-in-production' "$RUNNER_TEMP/smoke-data/.env"; then
            echo "FAILED: the backfilled secret is the shipped public literal."
            exit 1
          fi
          echo "Session secret generated and persisted on the data volume, as #1194 requires."

      - name: Smoke test — every bundled addon loaded
        run: |
          # #1192: AddonsManager catches a failed addon and CONTINUES — correct,
          # one bad addon must not take the instance down — so two dead addons
          # in v4.13.0 were a log line and a healthy container. The image is the
          # one environment where the addon/host path is real; read its log.
          if docker logs ngdpbase-smoke 2>&1 | grep -q "Failed to load add-on"; then
            echo "FAILED: an addon did not load in the image:"
            docker logs ngdpbase-smoke 2>&1 | grep -A3 "Failed to load add-on"
            exit 1
          fi
          echo "No 'Failed to load add-on' in the container log."

      - name: Smoke test — HTTP checks
        run: |
          BASE=http://localhost:3000

          check() {
            local url="$1"
            local label="$2"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "$label → HTTP $code"
            if [ "$code" != "200" ] && [ "$code" != "302" ] && [ "$code" != "301" ]; then
              echo "FAILED: expected 2xx/3xx, got $code for $url"
              docker logs ngdpbase-smoke
              exit 1
            fi
          }

          check "$BASE/"       "Root"
          check "$BASE/login" "Login page"

          echo "All smoke tests passed."

      - name: Smoke test — dump logs on failure
        if: failure()
        run: docker logs ngdpbase-smoke 2>&1 || true

      - name: Smoke test — stop containers
        if: always()
        run: |
          docker rm -f ngdpbase-smoke 2>/dev/null || true
          docker rm -f ngdpbase-smoke-refuse 2>/dev/null || true

      # #1001: assert the runtime image really has no npm. #956 removed it and
      # nothing checked, so a later edit could put it back unnoticed — and the
      # inverse (an untargeted build shipping the devtools stage) is exactly the
      # failure this pair of assertions exists to catch.
      - name: Assert runtime image has no npm
        run: |
          if docker run --rm --entrypoint sh ${{ steps.img.outputs.ref }} \
               -c 'command -v npm || command -v npx' 2>/dev/null; then
            echo "FAILED: npm/npx present in the runtime image (#956, #1001)."
            exit 1
          fi
          echo "Runtime image has no npm/npx, as expected."

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          trivyignores: '.trivyignore'

      # Never on a PR: code-scanning alerts live per-ref, and uploading a PR's
      # results under refs/heads/master would rewrite master's alert state from
      # an unmerged branch.
      - name: Upload Trivy results to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          # Pin analyses to the master ref: release tags always point at master
          # HEAD, and code-scanning alerts live per-ref — an analysis uploaded
          # under refs/tags/v* never auto-closes master alerts (#878).
          ref: refs/heads/master
          sha: ${{ github.sha }}

      # =====================================================================
      # Devtools variant (#1001)
      # =====================================================================
      # Published as :<version>-devtools. Identical to the runtime image except
      # npm is retained, for consumers that build FROM ngdpbase and need to
      # `npm install` an addon into the derived layer — the packaged-addon model
      # in docs/platform/deployment/addon-packaged.md.
      #
      # Deliberately NOT Trivy-uploaded. It carries npm's vendored tree on
      # purpose, so scanning it would re-open exactly the alerts #956 closed and
      # then report them against master. It is a build input, never deployed.
      - name: Docker meta (devtools)
        id: meta-devtools
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.REGISTRY_USER }}/${{ env.DOCKER_IMAGE_NAME }}
          flavor: |
            suffix=-devtools,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=ngdpbase-devtools
            org.opencontainers.image.description=ngdpbase with npm retained — for derived builds only, not for deployment
            org.opencontainers.image.vendor=ngdpbase Project

      - name: Resolve devtools image reference
        id: img-devtools
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ env.DOCKER_IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-devtools" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ env.DOCKER_REGISTRY }}/${{ env.REGISTRY_USER }}/${{ env.DOCKER_IMAGE_NAME }}:latest-devtools" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push devtools image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          target: devtools
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ github.event_name == 'pull_request' && steps.img-devtools.outputs.ref || steps.meta-devtools.outputs.tags }}
          labels: ${{ steps.meta-devtools.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ env.DOCKER_NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The regression check that would have caught #1001 before it shipped:
      # prove the derived-build path actually works, rather than assuming it.
      - name: Assert devtools image can run npm and build FROM
        run: |
          docker run --rm --entrypoint sh ${{ steps.img-devtools.outputs.ref }} \
            -c 'npm --version && npx --version' \
            || { echo "FAILED: npm/npx missing from the devtools image (#1001)."; exit 1; }

          # Prove a derived image can install a package — the flow #956 broke.
          # Empty build context on purpose: nothing is COPYed, and pointing this
          # at /tmp or the repo root would ship a large context for no reason.
          CTX="$(mktemp -d)"
          cat > "$CTX/Dockerfile" <<'EOF'
          ARG BASE
          FROM ${BASE}
          WORKDIR /derived
          RUN npm install --no-audit --no-fund is-number@7.0.0 \
              && node -e "require('/derived/node_modules/is-number')"
          EOF
          docker build \
            --build-arg BASE=${{ steps.img-devtools.outputs.ref }} \
            -t ngdpbase-derived-check "$CTX" \
            || { echo "FAILED: cannot build FROM the devtools image (#1001)."; exit 1; }
          docker rmi -f ngdpbase-derived-check 2>/dev/null || true
          rm -rf "$CTX"
          echo "Derived-build path verified."

      - name: Image digest
        run: |
          echo "Image digest: ${{ steps.meta.outputs.digest }}"
