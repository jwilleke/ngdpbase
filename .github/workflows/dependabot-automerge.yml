name: Dependabot auto-merge

# The operator does not approve routine dependency updates (#clara-ops,
# 2026-11-01). A Dependabot pull request for a patch or minor version is set
# to auto-merge (squash); GitHub merges it only once every required check has
# passed against the current master (the ruleset is strict), so nothing
# untested lands. A major version, or anything that is not Dependabot's,
# is left for a person.
#
# Needs "Allow auto-merge" on in the repository settings. Without it,
# `gh pr merge --auto` fails and the pull request just waits as before.

on:
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge for patch and minor updates
    runs-on: ubuntu-latest
    # The PR's author, not the actor: a person re-running a job on a
    # Dependabot PR must not make their own PR eligible.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Read the update
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A grouped PR reports its highest update type, so one major in the
      # group keeps the whole group for a person.
      - name: Enable auto-merge
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Say why a major is left
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: echo "Major update ($NAMES): left for review." >> "$GITHUB_STEP_SUMMARY"
