name: secret-scan

# gitleaks over the checked-out tree: the default secret rules plus the rules and
# allowlists in .gitleaks.toml. The pre-commit hook scans staged changes on the
# machine; this catches commits made without it (other machines, cloud agents).
#
# Kit-managed (overwrite): the pinned gitleaks version and checksum stay in sync
# kit-wide. A repo's own exceptions belong in .gitleaks.toml, which the kit seeds
# once and never touches again.
# https://github.com/jwilleke/mjs-project-template/issues/96

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1

    steps:
      - uses: actions/checkout@v7

      # The tarball is cached on the pinned version so a GitHub release outage
      # (504s on 2026-11-08/09, #110) cannot fail the scan. A hit makes no
      # request to github.com/gitleaks; a miss downloads, and the post-job hook
      # saves the file. The checksum runs on every run, cached or not.
      - name: Cache the gitleaks tarball
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gitleaks-dl
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ env.GITLEAKS_VERSION }}

      - name: Install gitleaks
        env:
          HIT: ${{ steps.cache.outputs.cache-hit }}
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dl="$RUNNER_TEMP/gitleaks-dl"
          mkdir -p "$dl"
          if [ "$HIT" = "true" ]; then
            echo "gitleaks: cache hit, using $dl/$tarball (no download)"
          else
            echo "gitleaks: cache miss, downloading $tarball"
            curl -sSfL -o "$dl/$tarball" \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          fi
          echo "$GITLEAKS_SHA256  $dl/$tarball" | sha256sum -c -
          tar -xzf "$dl/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the tree
        run: gitleaks dir . -c .gitleaks.toml --no-banner --redact -v
