name: CI - Continuous Integration

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  # Manual trigger. This workflow sat `disabled_manually` from 2026-04-14 to
  # 2026-08-23 because two auxiliary jobs went permanently red (a renamed
  # config key in Smoke Tests, a pre-TypeScript-migration server path in E2E)
  # and the whole pipeline was switched off rather than the jobs fixed. Both
  # causes were repaired in the tree long before anyone noticed CI was off.
  # Without a dispatch trigger the only way to test a CI change is to push to
  # master, which is what made it cheaper to leave it disabled than to verify
  # a fix. See https://github.com/jwilleke/ngdpbase/issues/1085
  workflow_dispatch:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      # #1192: every bundled addon must load with NODE's resolver, not vitest's.
      # Two addons shipped dead in v4.13.0 while every other gate was green.
      - name: Addons load in Node
        run: npm run check:addon-load

      # --- #1093 diagnostics -------------------------------------------------
      # The Test Suite job goes red in roughly 1 run in 7 with a Vitest file
      # "missing" from node_modules, while every test passes. The stack says
      # `requireStack: ['internal/preload']`, i.e. Node failing to preload
      # vitest/suppress-warnings.cjs when the pool FORKS A WORKER — not an
      # incomplete install: npm ci finished a minute earlier and hundreds of
      # files already ran against the same tree.
      #
      # Node's resolver reports MODULE_NOT_FOUND when `stat` fails for ANY
      # reason, so a genuinely-present file looks missing under fd exhaustion.
      # These steps exist to tell that apart from the file actually being gone.
      # Remove them once #1093 is closed.
      - name: Record capacity before tests (#1093)
        run: |
          echo "::group::Limits and capacity"
          echo "nproc:             $(nproc)"
          echo "ulimit -n (fds):   $(ulimit -n)"
          echo "ulimit -u (procs): $(ulimit -u)"
          echo "fs.file-max:       $(cat /proc/sys/fs/file-max)"
          free -m
          df -h /home/runner/work
          echo "::endgroup::"
          echo "::group::Vitest install integrity"
          node -p "'vitest ' + require('vitest/package.json').version"
          echo "files under node_modules/vitest: $(find node_modules/vitest -type f | wc -l)"
          # Fail HERE, where the message is unambiguous, if the tree is short.
          for f in node_modules/vitest/suppress-warnings.cjs \
                   node_modules/vitest/dist/workers/forks.js; do
            if [ -f "$f" ]; then echo "present: $f"; else echo "MISSING: $f"; exit 1; fi
          done
          # Full manifest, so the post-run step can NAME what disappeared
          # rather than only counting it. Confirmed necessary: failing runs end
          # with 114 files under node_modules/vitest where green runs end with
          # 124, and errors have also named fs-extra and expect-type — so the
          # deletions are not confined to vitest and the whole tree is snapshot.
          find node_modules -type f 2>/dev/null | sort > /tmp/nm-before.txt
          echo "manifest: $(wc -l < /tmp/nm-before.txt) files under node_modules"
          echo "::endgroup::"

      # THE FIX for #1093, after the diagnostics above named the mutator: a
      # literal bare `npm update` runs DURING the test step (process sampler,
      # run 32972478260 — 0 samples on every green run, 14 on the red one).
      # `npm update` re-resolves against semver ranges and reifies
      # node_modules mid-suite, which deletes vitest's worker files under a
      # running pool: every downstream symptom follows (preload
      # MODULE_NOT_FOUND, tree ending 799 files LARGER, the silent 359→357
      # collection shrink). Nothing in this repo or this workflow spawns it —
      # the caller is environmental and unnamed.
      #
      # So the fix does not require naming it: a PATH shim makes `npm update`
      # a refused no-op for the remainder of the job, and when the mystery
      # caller strikes, the shim logs its full parent-process chain — turning
      # the next occurrence into the identification the hunt was missing,
      # while the run stays green because the tree is never mutated.
      - name: Shim npm — refuse `npm update` during tests (#1093)
        run: |
          mkdir -p /tmp/npm-shim
          real_npm="$(command -v npm)"
          cat > /tmp/npm-shim/npm <<SHIM
          #!/bin/bash
          if [ "\$1" = "update" ]; then
            {
              echo "=== BLOCKED: npm update at \$(date -u +%H:%M:%S) (#1093) ==="
              echo "argv: npm \$*"
              pid=\$\$
              while [ -n "\$pid" ] && [ "\$pid" != "0" ] && [ "\$pid" != "1" ]; do
                args=\$(tr '\0' ' ' < "/proc/\$pid/cmdline" 2>/dev/null)
                echo "  pid \$pid: \${args:-<gone>}"
                pid=\$(awk '{print \$4}' "/proc/\$pid/stat" 2>/dev/null)
              done
            } >> /tmp/npm-update-blocked.log 2>&1
            exit 0
          fi
          exec "$real_npm" "\$@"
          SHIM
          chmod +x /tmp/npm-shim/npm
          echo "/tmp/npm-shim" >> "$GITHUB_PATH"
          echo "npm shim installed in front of $real_npm"

      - name: Sample resource use during tests (#1093)
        run: |
          # Backgrounded sampler. Open descriptors across all processes and
          # memory, every 2s, so a spike that coincides with the failure is
          # visible rather than inferred.
          # /proc/sys/fs/file-nr is "allocated / free / max" system-wide and
          # costs a single read — lsof would take seconds per sample and
          # consume the very descriptors being counted.
          cat > /tmp/sampler.sh <<'SAMPLER'
          #!/bin/bash
          while true; do
            read -r allocated _ max < /proc/sys/fs/file-nr
            mem=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)
            procs=$(ls -d /proc/[0-9]* 2>/dev/null | wc -l)
            echo "$(date -u +%H:%M:%S) fds=${allocated}/${max} procs=${procs} mem_avail=${mem}MB"
            # NAME the mutator. node_modules is rewritten on failing runs and
            # nothing in this repo spawns npm, so log any process that could be
            # installing. Whole command lines, deduplicated per sample.
            ps -eo args= 2>/dev/null \
              | grep -E '(^|/)(npm|npx|pnpm|yarn|node-gyp)( |$)|install' \
              | grep -v grep | sort -u | sed "s/^/$(date -u +%H:%M:%S) PROC /"
            sleep 2
          done
          SAMPLER
          chmod +x /tmp/sampler.sh
          nohup /tmp/sampler.sh > /tmp/resource-samples.log 2>&1 &
          echo "sampler_pid=$!" >> "$GITHUB_ENV"

      - name: Run all tests
        run: npm test -- --maxWorkers=2
        env:
          NODE_ENV: test

      # THE decisive measurement. If the files are still here after a run that
      # said they were missing, nothing deleted them and the cause is transient
      # resolution failure under load. If they are genuinely gone, something in
      # the suite is removing them and the hunt moves into the tests.
      - name: Check whether Vitest files survived (#1093)
        if: always()
        run: |
          echo "::group::Did the mystery npm update strike (and get blocked)? (#1093)"
          if [ -s /tmp/npm-update-blocked.log ]; then
            echo "::warning title=#1093 npm update blocked::The environmental 'npm update' fired during tests and was refused by the shim. Caller chain below — paste it into #1093."
            cat /tmp/npm-update-blocked.log
          else
            echo "no npm update attempt observed this run"
          fi
          echo "::endgroup::"
          echo "::group::Vitest install integrity AFTER the run"
          echo "files under node_modules/vitest: $(find node_modules/vitest -type f 2>/dev/null | wc -l)"
          integrity_ok=1
          for f in node_modules/vitest/suppress-warnings.cjs \
                   node_modules/vitest/dist/workers/forks.js; do
            if [ -f "$f" ]; then echo "STILL PRESENT: $f"; else echo "GONE: $f"; integrity_ok=0; fi
          done
          echo "::endgroup::"
          echo "::group::What changed under node_modules during the run"
          find node_modules -type f 2>/dev/null | sort > /tmp/nm-after.txt
          echo "before: $(wc -l < /tmp/nm-before.txt)  after: $(wc -l < /tmp/nm-after.txt)"
          echo "--- DELETED during the run (first 200) ---"
          comm -23 /tmp/nm-before.txt /tmp/nm-after.txt | head -200
          echo "--- CREATED during the run (first 50) ---"
          comm -13 /tmp/nm-before.txt /tmp/nm-after.txt | head -50
          echo "::endgroup::"
          echo "::group::Capacity after the run"
          free -m
          df -h /home/runner/work
          echo "::endgroup::"
          echo "::group::Kernel messages (OOM killer, if any)"
          sudo dmesg --time-format iso 2>/dev/null | tail -40 || echo "dmesg unavailable"
          echo "::endgroup::"
          echo "::group::Processes seen that could rewrite node_modules"
          grep " PROC " /tmp/resource-samples.log 2>/dev/null | sort -u | head -40 \
            || echo "no install-like process ever observed"
          echo "::endgroup::"
          echo "::group::Resource samples during the run"
          # Guarded: a bare `kill 0` would signal the whole process group,
          # this step included.
          if [ -n "${sampler_pid:-}" ] && [ "${sampler_pid}" -gt 0 ] 2>/dev/null; then
            kill "${sampler_pid}" 2>/dev/null || true
          fi
          tail -60 /tmp/resource-samples.log 2>/dev/null || echo "no samples captured"
          echo "::endgroup::"
          # #1093 enforcement: with the shim blocking the mutator, the guard
          # files must survive every run. If they are still vanishing, the
          # mutator found a path around the shim — fail HERE, by name, rather
          # than through a preload stack trace that reads like an install
          # problem (or worse, the silent 359→357 collection shrink).
          if [ "${integrity_ok:-1}" = "0" ]; then
            echo "::error title=#1093 node_modules mutated during tests::vitest guard files were deleted mid-run DESPITE the npm-update shim. The mutator bypassed PATH — reopen the hunt with the process samples above."
            exit 1
          fi
      # --- end #1093 diagnostics ---------------------------------------------

      - name: Generate coverage report
        run: npm test -- --coverage --maxWorkers=2
        env:
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.node-version == '24.x'
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      # Coverage thresholds removed - tests pass but coverage is ~25%
      # Re-enable when coverage improves (see Issue #180)

  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run markdown lint
        run: |
          echo "Checking markdown files..."
          if [ -f ".markdownlint-cli2.jsonc" ]; then
            npm run lint:md
          else
            echo "Skipping markdown lint (not configured)"
          fi

      - name: Check for debugging code
        run: |
          echo "Checking for console.log and debugger statements..."
          if git grep -n "console\.log\|debugger" -- '*.js' '*.ts' ':!node_modules' ':!dist' ':!coverage' ':!*.test.js' ':!**/tests/**' ':!**/__tests__/**'; then
            echo "Warning: Found console.log or debugger statements in source code"
            echo "This is a warning only - not failing the build"
          else
            echo "No debugging code found"
          fi

      - name: Check for TODO comments
        run: |
          echo "Checking for TODO comments..."
          if git grep -n "TODO:" -- 'src/**/*.js' ':!**/__tests__/**'; then
            echo "Warning: Found TODO comments in source code"
            echo "This is a warning only - not failing the build"
          else
            echo "No TODO comments found"
          fi

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Create required directories
        run: |
          mkdir -p pages data logs sessions

      - name: Check required pages exist
        run: |
          echo "Verifying required pages by frontmatter title..."
          # Required pages use UUID filenames with titles in YAML frontmatter
          check_page() {
            local title="$1"
            if grep -l "^title: ${title}$" required-pages/*.md > /dev/null 2>&1; then
              echo "✓ Found page: ${title}"
              return 0
            else
              echo "✗ Missing required page with title: ${title}"
              return 1
            fi
          }

          failed=0
          check_page "Welcome" || failed=1
          check_page "LeftMenu" || failed=1

          if [ $failed -eq 1 ]; then
            echo "Required pages verification failed"
            exit 1
          fi
          echo "All required pages verified"

      - name: Check configuration
        run: |
          echo "Verifying critical configuration..."
          node -e "
            const config = require('./config/app-default-config.json');
            const required = [
              'ngdpbase.server.port',
              'ngdpbase.application-name',
              'ngdpbase.page.provider.filesystem.storagedir'
            ];
            required.forEach(key => {
              if (!config[key]) throw new Error('Missing config: ' + key);
            });
            console.log('Configuration validated');
          "

      - name: Test WikiEngine initialization
        run: |
          echo "Testing WikiEngine initialization..."
          # Project is ESM (type: module). Use dynamic import on the BUILT
          # output (npm run build ran above) so we don't pay the tsx
          # transform on a smoke check.
          timeout 30 node --input-type=module -e "
            const { default: WikiEngine } = await import('./dist/src/WikiEngine.js');
            const engine = new WikiEngine();
            await engine.initialize();
            const required = ['PageManager', 'RenderingManager', 'UserManager'];
            for (const name of required) {
              if (!engine.getManager(name)) throw new Error('Manager not loaded: ' + name);
            }
            console.log('WikiEngine initialization successful');
            process.exit(0);
          "

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check if build script exists
        id: check-build
        run: |
          if npm run | grep -q "build"; then
            echo "has_build=true" >> $GITHUB_OUTPUT
          else
            echo "has_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Run build
        if: steps.check-build.outputs.has_build == 'true'
        run: npm run build

      - name: Skip build
        if: steps.check-build.outputs.has_build == 'false'
        run: echo "No build script defined - skipping"

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Setup E2E test environment
        run: |
          # Use the seed script to create test data using the app's actual managers
          # This ensures compatibility with current user structure and password hashing
          mkdir -p tests/e2e/.auth
          npx tsx scripts/seed-e2e-test-data.ts

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          E2E_BASE_URL: http://localhost:3099
          # The seed step writes data/.install-complete, and from that point
          # ConfigurationManager refuses to start without an explicit base URL
          # rather than silently defaulting to localhost:3000 and emitting
          # broken absolute URLs (#642). Playwright's webServer inherits this
          # env, so it has to be set here and has to match the 3099 the
          # webServer command binds to — a mismatch would boot the app fine
          # and then hand every absolute URL the wrong port.
          NGDPBASE_BASE_URL: http://localhost:3099
          # #631: the system principal is a name from the environment and the
          # app refuses to boot without one. The webServer inherits this too.
          NGDPBASE_SYSTEM_USER: ci-system
          CI: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/.output/
          retention-days: 30

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, lint, smoke-test, build, e2e-test]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "CI Pipeline Results:"
          echo "- Tests: ${{ needs.test.result }}"
          echo "- Lint: ${{ needs.lint.result }}"
          echo "- Smoke Tests: ${{ needs.smoke-test.result }}"
          echo "- Build: ${{ needs.build.result }}"
          echo "- E2E Tests: ${{ needs.e2e-test.result }}"

          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.smoke-test.result }}" != "success" ]; then
            echo "CI pipeline failed!"
            exit 1
          fi

          # E2E test failures are warnings, not failures (for now)
          if [ "${{ needs.e2e-test.result }}" != "success" ]; then
            echo "Warning: E2E tests failed but not blocking CI"
          fi

          echo "CI pipeline passed!"
