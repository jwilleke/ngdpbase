name: CI - Continuous Integration

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run all tests
        run: npm test -- --maxWorkers=2
        env:
          NODE_ENV: test

      - name: Generate coverage report
        run: npm test -- --coverage --maxWorkers=2
        env:
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '24.x'
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      # Coverage thresholds removed - tests pass but coverage is ~25%
      # Re-enable when coverage improves (see Issue #180)

  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run markdown lint
        run: |
          echo "Checking markdown files..."
          # Skip if markdownlint is not configured
          if [ -f ".markdownlint.json" ]; then
            npm run lint:md || echo "Warning: Markdown lint found issues"
          else
            echo "Skipping markdown lint (not configured)"
          fi

      - name: Check for debugging code
        run: |
          echo "Checking for console.log and debugger statements..."
          if git grep -n "console\.log\|debugger" -- '*.js' '*.ts' ':!node_modules' ':!dist' ':!coverage' ':!*.test.js' ':!**/tests/**' ':!**/__tests__/**'; then
            echo "Warning: Found console.log or debugger statements in source code"
            echo "This is a warning only - not failing the build"
          else
            echo "No debugging code found"
          fi

      - name: Check for TODO comments
        run: |
          echo "Checking for TODO comments..."
          if git grep -n "TODO:" -- 'src/**/*.js' ':!**/__tests__/**'; then
            echo "Warning: Found TODO comments in source code"
            echo "This is a warning only - not failing the build"
          else
            echo "No TODO comments found"
          fi

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Create required directories
        run: |
          mkdir -p pages data logs sessions

      - name: Check required pages exist
        run: |
          echo "Verifying required pages by frontmatter title..."
          # Required pages use UUID filenames with titles in YAML frontmatter
          check_page() {
            local title="$1"
            if grep -l "^title: ${title}$" required-pages/*.md > /dev/null 2>&1; then
              echo "✓ Found page: ${title}"
              return 0
            else
              echo "✗ Missing required page with title: ${title}"
              return 1
            fi
          }

          failed=0
          check_page "Welcome" || failed=1
          check_page "LeftMenu" || failed=1

          if [ $failed -eq 1 ]; then
            echo "Required pages verification failed"
            exit 1
          fi
          echo "All required pages verified"

      - name: Check configuration
        run: |
          echo "Verifying critical configuration..."
          node -e "
            const config = require('./config/app-default-config.json');
            const required = [
              'ngdpbase.server.port',
              'ngdpbase.application-name',
              'ngdpbase.page.provider.filesystem.storagedir'
            ];
            required.forEach(key => {
              if (!config[key]) throw new Error('Missing config: ' + key);
            });
            console.log('Configuration validated');
          "

      - name: Test WikiEngine initialization
        run: |
          echo "Testing WikiEngine initialization..."
          # Project is ESM (type: module). Use dynamic import on the BUILT
          # output (npm run build ran above) so we don't pay the tsx
          # transform on a smoke check.
          timeout 30 node --input-type=module -e "
            const { default: WikiEngine } = await import('./dist/src/WikiEngine.js');
            const engine = new WikiEngine();
            await engine.initialize();
            const required = ['PageManager', 'RenderingManager', 'UserManager'];
            for (const name of required) {
              if (!engine.getManager(name)) throw new Error('Manager not loaded: ' + name);
            }
            console.log('WikiEngine initialization successful');
            process.exit(0);
          "

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check if build script exists
        id: check-build
        run: |
          if npm run | grep -q "build"; then
            echo "has_build=true" >> $GITHUB_OUTPUT
          else
            echo "has_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Run build
        if: steps.check-build.outputs.has_build == 'true'
        run: npm run build

      - name: Skip build
        if: steps.check-build.outputs.has_build == 'false'
        run: echo "No build script defined - skipping"

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Setup E2E test environment
        run: |
          # Use the seed script to create test data using the app's actual managers
          # This ensures compatibility with current user structure and password hashing
          mkdir -p tests/e2e/.auth
          npx tsx scripts/seed-e2e-test-data.ts

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          E2E_BASE_URL: http://localhost:3099
          CI: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/.output/
          retention-days: 30

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, lint, smoke-test, build, e2e-test]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "CI Pipeline Results:"
          echo "- Tests: ${{ needs.test.result }}"
          echo "- Lint: ${{ needs.lint.result }}"
          echo "- Smoke Tests: ${{ needs.smoke-test.result }}"
          echo "- Build: ${{ needs.build.result }}"
          echo "- E2E Tests: ${{ needs.e2e-test.result }}"

          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.smoke-test.result }}" != "success" ]; then
            echo "CI pipeline failed!"
            exit 1
          fi

          # E2E test failures are warnings, not failures (for now)
          if [ "${{ needs.e2e-test.result }}" != "success" ]; then
            echo "Warning: E2E tests failed but not blocking CI"
          fi

          echo "CI pipeline passed!"
