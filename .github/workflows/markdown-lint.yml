name: Markdown Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No globs here on purpose. This block was a third hand-maintained copy
      # of the ignore list, kept in sync by comment rather than by anything
      # mechanical. What is linted is declared once, in .markdownlint-cli2.jsonc.
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
