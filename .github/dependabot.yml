# Dependabot version updates (#1243). Decision recorded on the issue:
# version updates on, root plus every bundled addon directory (each is its own
# npm root with its own lockfile, and Dependabot only sees a directory it is
# told about), weekly, minor+patch grouped per directory, majors separate.
# Security updates are unaffected by this file: they arrive regardless, one PR
# per advisory, never grouped. GitHub Actions bumps are watched too.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      root-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # @types/node tracks the Node the runtime actually is, not the newest one
      # published. The engine is Node >=24 and root pins ^24, so a major bump
      # here describes APIs that are not there at run time. Decided when
      # Dependabot proposed 18 to 26 (#1249, #1255-#1258, closed) and again at
      # 24 to 25/26 (#1280-#1282, #1286, #1290, #1296, closed). Lift this when
      # the engine moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies

