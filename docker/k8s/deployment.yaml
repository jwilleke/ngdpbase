# ngdpbase Kubernetes Deployment
# Deploy with: kubectl apply -f deployment.yaml
#
# CONFIGURATION SURFACES (three-way split; see HEADLESS-DEPLOYMENT-NOTES.md §10):
#
#   1. configmap-env.yaml   → flat NON-SENSITIVE env vars (NODE_ENV, HEADLESS_INSTALL,
#                             INSTANCE_DATA_FOLDER, NGDPBASE_BASE_URL, ...)
#                             Mounted via `envFrom: configMapRef:`.
#
#   2. secrets.yaml         → flat SENSITIVE env vars (NGDPBASE_SESSION_SECRET, OIDC
#                             client secrets, SMTP password, ...)
#                             Mounted via `envFrom: secretRef:`.
#
#   3. configmap.yaml       → structured ngdpbase.* dotted-key config as
#                             app-custom-config.json. SEEDED onto the data volume
#                             by an init container — NOT mounted into the app.
#                             Holds keys that don't fit flat env vars (arrays,
#                             nested objects).
#
# DEPLOYMENT STRATEGIES:
#
# Strategy 1: Interactive Installation (first deployment)
#   kubectl apply -f pvc.yaml
#   kubectl apply -f configmap-env.yaml   # with HEADLESS_INSTALL="false" to keep wizard
#   kubectl apply -f secrets.yaml
#   kubectl apply -f service.yaml
#   kubectl apply -f deployment.yaml      # WITHOUT configmap.yaml (the JSON one)
#   - Installation wizard runs on first access via web browser
#   - Config is written to PVC
#
# Strategy 2: Pre-configured (GitOps / automated)
#   kubectl apply -f pvc.yaml
#   kubectl apply -f configmap-env.yaml   # with HEADLESS_INSTALL="true"
#   kubectl apply -f secrets.yaml
#   kubectl apply -f configmap.yaml       # ngdpbase.* dotted-key JSON config
#   kubectl apply -f service.yaml
#   kubectl apply -f deployment.yaml
#   - An init container SEEDS app-custom-config.json onto the data volume on
#     first boot only. The file is then writable, so /admin/configuration keeps
#     working — it is not a read-only mount.
#   - You must pre-create admin user and .install-complete marker
#   - See configmap.yaml and HEADLESS-DEPLOYMENT-NOTES.md §1-§2 for details
#
# WHY SEED RATHER THAN MOUNT:
#   A subPath ConfigMap mount is read-only for the life of the deployment, so
#   every save from /admin/configuration failed with EROFS and changing any
#   setting meant editing a manifest and redeploying. Both production instances
#   hit that and moved config onto the volume (geohazardwatch 840b87c; the demo
#   after it). Application configuration must not require editing a deployment
#   manifest; manifests are for infrastructure.
#
#   The trade: seeding is FIRST BOOT ONLY. Once the file exists on the volume it
#   is never overwritten, so later edits to configmap.yaml do NOT reach a running
#   instance — change it through /admin/configuration instead, or delete the file
#   from the volume and restart to re-seed. That is deliberate: overwriting on
#   every start would silently discard operator edits, which is worse than the
#   honest EROFS it replaces.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngdpbase
  labels:
    app: ngdpbase
    app.kubernetes.io/name: ngdpbase
    app.kubernetes.io/component: wiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngdpbase
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ngdpbase
        app.kubernetes.io/name: ngdpbase
    spec:
      # Seed app-custom-config.json onto the data volume, first boot only.
      # Skipped entirely when the ConfigMap is absent (Strategy 1 / interactive
      # install) because the volume is marked `optional: true`, in which case
      # /seed is empty and the copy is a no-op.
      initContainers:
        - name: seed-config
          image: ngdpbase:latest
          imagePullPolicy: IfNotPresent
          # `-e` so a real copy failure fails the pod instead of starting an
          # instance with configuration the operator believes was applied.
          command: ['/bin/sh', '-e', '-c']
          args:
            - |
              mkdir -p /app/data/config
              if [ ! -f /seed/app-custom-config.json ]; then
                echo "seed-config: no ConfigMap present, nothing to seed"
              elif [ -f /app/data/config/app-custom-config.json ]; then
                echo "seed-config: app-custom-config.json already on the volume, leaving it alone"
              else
                cp /seed/app-custom-config.json /app/data/config/app-custom-config.json
                echo "seed-config: seeded app-custom-config.json onto the data volume"
              fi
          volumeMounts:
            - name: ngdpbase-data
              mountPath: /app/data
            - name: ngdpbase-config
              mountPath: /seed
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: ngdpbase
          image: ngdpbase:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          # Env vars come from two sources, both flat:
          #   - ngdpbase-env       ConfigMap (non-sensitive)  — see configmap-env.yaml.example
          #   - ngdpbase-secrets   Secret    (sensitive)      — see secrets.yaml.example
          # Add per-pod overrides under `env:` below if needed (env wins over envFrom).
          envFrom:
            - configMapRef:
                name: ngdpbase-env
            - secretRef:
                name: ngdpbase-secrets
                optional: true
          # Mount persistent volume for wiki data
          # All instance data stored here: pages, users, config, logs, etc.
          # Only the data volume. app-custom-config.json lives ON it, put there
          # by the seed-config init container above — deliberately NOT mounted
          # from the ConfigMap, which would make it read-only and break every
          # save from /admin/configuration.
          volumeMounts:
            - name: ngdpbase-data
              mountPath: /app/data
          # Resource limits
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          # Health checks
          livenessProbe:
            httpGet:
              # #1079: was `/`, a full page render through auth, ACL and the
              # template layer. This route checks nothing and touches no
              # session — a wedged process is the only thing it can fail on,
              # which is the only condition a restart fixes.
              path: /health/liveness
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              # #1079: 503 here removes the pod from rotation without killing
              # it, and reports not-ready while the engine is still indexing —
              # a state probing `/` could not express.
              path: /health/readiness
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Security context
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: false
      # Volumes
      volumes:
        - name: ngdpbase-data
          persistentVolumeClaim:
            claimName: ngdpbase-data-pvc
        - name: ngdpbase-config
          configMap:
            name: ngdpbase-config
            optional: true
      # Pod-level security
      securityContext:
        fsGroup: 1000
      # Restart policy
      restartPolicy: Always
