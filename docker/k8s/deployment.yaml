# ngdpbase Kubernetes Deployment
# Deploy with: kubectl apply -f deployment.yaml
#
# CONFIGURATION SURFACES (three-way split; see HEADLESS-DEPLOYMENT-NOTES.md §10):
#
#   1. configmap-env.yaml   → flat NON-SENSITIVE env vars (NODE_ENV, HEADLESS_INSTALL,
#                             INSTANCE_DATA_FOLDER, NGDPBASE_BASE_URL, ...)
#                             Mounted via `envFrom: configMapRef:`.
#
#   2. secrets.yaml         → flat SENSITIVE env vars (NGDPBASE_SESSION_SECRET, OIDC
#                             client secrets, SMTP password, ...)
#                             Mounted via `envFrom: secretRef:`.
#
#   3. configmap.yaml       → structured ngdpbase.* dotted-key config as
#                             app-custom-config.json. Mounted as a file via subPath.
#                             Holds keys that don't fit flat env vars (arrays,
#                             nested objects).
#
# DEPLOYMENT STRATEGIES:
#
# Strategy 1: Interactive Installation (first deployment)
#   kubectl apply -f pvc.yaml
#   kubectl apply -f configmap-env.yaml   # with HEADLESS_INSTALL="false" to keep wizard
#   kubectl apply -f secrets.yaml
#   kubectl apply -f service.yaml
#   kubectl apply -f deployment.yaml      # WITHOUT configmap.yaml (the JSON one)
#   - Installation wizard runs on first access via web browser
#   - Config is written to PVC
#
# Strategy 2: Pre-configured (GitOps / automated)
#   kubectl apply -f pvc.yaml
#   kubectl apply -f configmap-env.yaml   # with HEADLESS_INSTALL="true"
#   kubectl apply -f secrets.yaml
#   kubectl apply -f configmap.yaml       # ngdpbase.* dotted-key JSON config
#   kubectl apply -f service.yaml
#   kubectl apply -f deployment.yaml
#   - JSON ConfigMap mounted read-only — installation wizard cannot write to it
#   - You must pre-create admin user and .install-complete marker
#   - See configmap.yaml and HEADLESS-DEPLOYMENT-NOTES.md §1-§2 for details
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngdpbase
  labels:
    app: ngdpbase
    app.kubernetes.io/name: ngdpbase
    app.kubernetes.io/component: wiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngdpbase
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ngdpbase
        app.kubernetes.io/name: ngdpbase
    spec:
      containers:
        - name: ngdpbase
          image: ngdpbase:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          # Env vars come from two sources, both flat:
          #   - ngdpbase-env       ConfigMap (non-sensitive)  — see configmap-env.yaml.example
          #   - ngdpbase-secrets   Secret    (sensitive)      — see secrets.yaml.example
          # Add per-pod overrides under `env:` below if needed (env wins over envFrom).
          envFrom:
            - configMapRef:
                name: ngdpbase-env
            - secretRef:
                name: ngdpbase-secrets
                optional: true
          # Mount persistent volume for wiki data
          # All instance data stored here: pages, users, config, logs, etc.
          volumeMounts:
            - name: ngdpbase-data
              mountPath: /app/data
            # Mount ConfigMap for custom configuration (optional)
            # WARNING: This mount is read-only. If ConfigMap exists:
            #   - Installation wizard CANNOT write to this file
            #   - You must pre-create admin user and .install-complete marker
            # For interactive installation, do NOT apply the ConfigMap
            - name: ngdpbase-config
              mountPath: /app/data/config/app-custom-config.json
              subPath: app-custom-config.json
              readOnly: true
          # Resource limits
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          # Health checks
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Security context
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: false
      # Volumes
      volumes:
        - name: ngdpbase-data
          persistentVolumeClaim:
            claimName: ngdpbase-data-pvc
        - name: ngdpbase-config
          configMap:
            name: ngdpbase-config
            optional: true
      # Pod-level security
      securityContext:
        fsGroup: 1000
      # Restart policy
      restartPolicy: Always
