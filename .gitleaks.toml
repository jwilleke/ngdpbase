# gitleaks configuration — the default secret rules, plus two for internal hosts.
#
# Seeded by mjs-project-template's agent kit (#96) and then owned by this repo:
# the kit never overwrites it, so add allowlists here freely.
#
# mjs-project-template#83: the kit boilerplate linked a wiki on the operator's
# private network by its real hostname and port, and every synced repo copied
# it. No default rule looks for hostnames, so nothing caught it. These two rules
# cover the shapes that actually leaked, WITHOUT naming any host: a rule listing
# the hostname would publish it again in a public file.
# https://github.com/jwilleke/mjs-project-template/issues/83
#
# Run by the pre-commit hook (staged changes) and by
# .github/workflows/secret-scan.yml (the whole tree).
# A false positive belongs in an allowlist below, with a comment saying why.

title = "gitleaks"

[extend]
useDefault = true

# A URL with an explicit port is almost always a service on somebody's own
# network — public sites sit on 80/443 and do not print a port. The leaked link
# had this shape.
[[rules]]
id = "internal-host-url"
description = "URL with an explicit port: likely an internal service address"
regex = '''(?i)\b(?:https?|wss?)://[a-z0-9][a-z0-9.-]*:[0-9]{2,5}\b'''
keywords = ["://"]

# Loopback and reserved example hosts name nothing real.
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''(?i)://(?:localhost|127\.0\.0\.1|0\.0\.0\.0):''',
  '''(?i)://(?:[a-z0-9-]+\.)*example\.(?:com|org|net):''',
]

# Reserved names (RFC 2606 / RFC 6761) resolve to nothing on any network:
# `es.example`, `fairways.localhost`. Tests and docs use them as stand-ins.
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''(?i)://(?:[a-z0-9-]+\.)+(?:example|test|invalid|localhost):''',
]

# Single-label placeholders. `sist2` and `elasticsearch` are docker-compose
# service names in examples; `host` and `your-server` are "substitute your own"
# stand-ins in setup docs. None is anybody's machine.
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''(?i)://(?:sist2|elasticsearch|host|your-server):''',
]

# Fixed addresses that the egress-guard tests and docs need as literals because
# the guard's behaviour depends on the address class. They name no host:
# - 169.254.169.254 is the cloud metadata address, the same everywhere.
# - 10.0.0.5 and 192.168.0.10 are invented RFC1918 examples.
# - sist2.internal is an invented name for the ".internal is refused" case.
# Add a real LAN address here and the rule stops protecting it — replace it in
# the file instead.
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''://(?:169\.254\.169\.254|10\.0\.0\.5|192\.168\.0\.10|sist2\.internal):''',
]

# A file-share URL names a host on a private network by construction. This
# repo's history carried one (a NAS path) before any scan existed.
[[rules]]
id = "file-share-url"
description = "SMB/NFS/AFP/CIFS URL: names a host on a private network"
regex = '''(?i)\b(?:smb|nfs|afp|cifs)://[^\s'"<>)]+'''
keywords = ["smb://", "nfs://", "afp://", "cifs://"]

# A "your-..." value in a curl example is a placeholder the reader replaces,
# not a credential (required-pages cache-eviction help: `x-csrf-token:
# your-csrf-token`). Only the literal your-<words> shape is let through.
[[allowlists]]
description = "Placeholder header values in documentation curl examples"
targetRules = ["curl-auth-header"]
regexTarget = "secret"
regexes = ['''^your-[a-z-]+$''']
